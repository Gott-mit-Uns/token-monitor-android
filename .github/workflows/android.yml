name: Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check documentation links
        run: node tools/check-docs.mjs
      - name: Verify Android source and local extension boundaries
        run: |
          git fetch --no-tags --depth=1 https://github.com/The-Minion-oOo/token-monitor-android.git bf348606a41e468b534bf097dfd3501f186e9601
          git fetch --no-tags --depth=1 origin 1bfd0de63e2ac0ae6a559b26b5dc32d45046294e
          node tools/check-maintenance.mjs
          node --test tools/check-upstream.test.mjs
      - name: Test, lint, and build
        run: ./gradlew :app:testDebugUnitTest lint :app:assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: token-monitor-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
