name: Upstream release check

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: upstream
        name: Compare verified and latest releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/check-upstream.ps1
      - name: Open compatibility review issue
        if: steps.upstream.outputs.update_available == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `Review Token Monitor ${process.env.LATEST_TAG}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The verified desktop baseline is ${process.env.CURRENT_TAG}. Review ${process.env.RELEASE_URL} and follow docs/UPSTREAM_SYNC.md before changing compatibility metadata.`
              });
            }
        env:
          CURRENT_TAG: ${{ steps.upstream.outputs.current_tag }}
          LATEST_TAG: ${{ steps.upstream.outputs.latest_tag }}
          RELEASE_URL: ${{ steps.upstream.outputs.release_url }}
